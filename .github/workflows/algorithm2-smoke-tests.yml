name: Algorithm 2 source-rewrite smoke tests
on:
  pull_request:
  push:
    branches: [fix/reviewer-algorithm2]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s review_update/tests -v
